<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Box Model</title>
<style>
.box { width: 200px; padding: 20px; border: 5px solid #1d3557; margin-bottom: 16px; background:#dbeafe; }
.content { box-sizing: content-box; }
.border { box-sizing: border-box; }
</style>
</head>
<body>
<div class="box content">content-box</div>
<div class="box border">border-box</div>
</body>
</html>
