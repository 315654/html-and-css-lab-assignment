<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>First Grid</title>

<style>
.box { background: #a8dadc; padding: 24px; text-align: center; border-radius: 6px; }
body { font-family: Arial, sans-serif; margin: 24px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
</style>
</head>
<body>
<div class="grid">
<div class="box">1</div>
<div class="box">2</div>
<div class="box">3</div>
<div class="box">4</div>
<div class="box">5</div>
<div class="box">6</div>
</div>
</body>
</html>
