<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<style>

body { margin: 0; font-family: Arial, sans-serif; }
.dashboard {
display: grid;
grid-template-columns: 200px 1fr;
grid-template-areas:
"header header"
"sidebar main"
"footer footer";
min-height: 100vh;
}
.dashboard div { padding: 16px; }
.header { grid-area: header; background: #1d3557; color: white; }
.sidebar { grid-area: sidebar; background: #a8dadc; }
.main { grid-area: main; background: #f1faee; }
.footer { grid-area: footer; background: #457b9d; color: white; }
</style>
</head>
<body>
<div class="dashboard">
<div class="header">Header</div>
<div class="sidebar">Sidebar</div>
<div class="main">Main</div>
<div class="footer">Footer</div>
</div>
</body>
</html>
