<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Centred Cards</title>
<style>
body { font-family: Arial, sans-serif; margin: 24px; }
.card { border: 2px solid #1d3557; border-radius: 8px; padding: 12px 24px; text-align: center;
background: #f1f5f9; }
.row { display: flex; justify-content: center; align-items: center; gap: 16px; height: 250px; border:
1px dashed #999; }
</style>
</head>
<body>
<div class="row">
<div class="card"><h3>Starter</h3><p>199</p></div>
<div class="card"><h3>Standard</h3><p>349</p></div>
<div class="card"><h3>Premium</h3><p>499</p></div>
</div>
</body>
</html>
