<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marks Accessible</title>
<style>
body { font-family: Arial, sans-serif; margin: 24px; }
table { border-collapse: collapse; }
th, td { border: 1px solid #555; padding: 8px 16px; text-align: left; }
thead, tfoot { background: #e5e7eb; }
caption { font-weight: bold; margin-bottom: 8px; }
</style>
</head>
<body>
<table>
<caption>Marks of Class A</caption>
<thead>
<tr><th scope="col">Name</th><th scope="col">Maths</th><th scope="col">Science</th></tr>
</thead>
<tbody>
<tr><th scope="row">Asha</th><td>78</td><td>85</td></tr>
<tr><th scope="row">Rohan</th><td>64</td><td>70</td></tr>
</tbody>
</table>
</body>
</html>
