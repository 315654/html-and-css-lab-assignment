<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Units</title>
<style>
div { height: 40px; margin-bottom: 10px; }
.fixed { width: 200px; background-color: #457b9d; }
.half { width: 50%; background-color: #e76f51; }
p { font-size: 1.5rem; }
</style>
</head>
<body>
<div class="fixed"></div>
<div class="half"></div>
<p>This text is 1.5rem, so it is larger than the normal text size.</p>
</body>
</html>
