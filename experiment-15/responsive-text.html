<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Text</title>
<style>
body { font-family: Arial, sans-serif; font-size: 1rem; margin: 16px; }
h1 { font-size: 1.5rem; }
@media (min-width: 600px) {
h1 { font-size: 2.5rem; }
}
</style>
</head>
<body>
<h1>Welcome to My Page</h1>
<p>The heading above becomes larger when the screen is wide enough.</p>
</body>
</html>
